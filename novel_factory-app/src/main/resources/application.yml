spring:
  config:
    name: novel_factory-app
  profiles:
    active: dev
  ai:
    retry:
      # 传输层不重试（重试收权到业务层，避免 5xx 时 token 白烧 10 次）
      max-attempts: 3

# LLM / Embedding 出网超时（秒）
# 背景：Spring 的 RestClient 与 JDK 的 HttpClient 默认都不设超时，供应商（DashScope 等）静默不回包时，
#      调用线程会永久阻塞在等待响应上——既不抛异常也不重试，作业表现为"卡住不动"（2026-09-15 ch106 实际发生）。
#      connect-timeout 管建连阶段；read-timeout 管单次请求的整体响应时限，超时抛异常后落入既有瞬时失败重试。
# 取值依据：非推理模型实测最慢单次约 199s（glm-5.2 章节规划/审校）、中位约 17s。
# 2026-09-30 由 300 上调到 900：**推理（思考）模型的单次调用量级完全不同**——
# 实测 kimi-k3 跑卷蓝图这种小 prompt（290 token 输入）就要 267s，最大一次 795s 才报 500 engine abort
# （即思考 token 与生成时间同量级放大，不只是输出变长）。300s 会把正常的思考调用**误判为超时**，
# 而超时属 TRANSIENT（不换模型）→ 传输层重试 → 三次都超时 → 整批终止。
# 900s = 实测最慢成功调用的约 3 倍余量，同时仍能在供应商真挂住时收敛（不会无限等）。
# 若把更多场景切到 kimi-k3 这类深度思考模型，需要继续上调；反之若全部退回非思考模型可回调到 300。
novel:
  llm:
    connect-timeout-seconds: 20
    # 2026-10-02 由 900 提到 1800：glm-5.3 强制思考对 5 章计划的规划调用实测 7-8 分钟
    # 仍截断（输出预算不足），65536 预算下单次调用可能更长——900s 会误杀正常长思考
    read-timeout-seconds: 1800
